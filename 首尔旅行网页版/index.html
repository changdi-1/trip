<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2026 年 9 月首尔四日旅行互动路线地图">
  <title>首尔 4 日路线图</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-icon" aria-hidden="true"><i data-lucide="map"></i></div>
        <div>
          <h1>首尔 4 日路线图</h1>
          <p>2026.09.24–09.27 · 6 人 · 美食 / 购物 / 人文</p>
        </div>
      </div>
      <div class="weather-brief" aria-label="旅行天气参考">
        <i data-lucide="cloud-sun"></i>
        <span>23–25°C</span>
        <small>夜间 14–17°C</small>
      </div>
    </header>

    <nav class="day-tabs" aria-label="选择行程日期">
      <button class="day-tab is-active" type="button" data-day="all" aria-pressed="true">
        <span>全部路线</span>
        <small>4 天总览</small>
      </button>
      <button class="day-tab" type="button" data-day="1" aria-pressed="false">
        <span>第 1 天</span>
        <small>9/24 · 抵达</small>
      </button>
      <button class="day-tab" type="button" data-day="2" aria-pressed="false">
        <span>第 2 天</span>
        <small>9/25 · 人文</small>
      </button>
      <button class="day-tab" type="button" data-day="3" aria-pressed="false">
        <span>第 3 天</span>
        <small>9/26 · 购物</small>
      </button>
      <button class="day-tab" type="button" data-day="4" aria-pressed="false">
        <span>第 4 天</span>
        <small>9/27 · 返程</small>
      </button>
    </nav>

    <main class="workspace">
      <aside class="itinerary-panel" aria-label="行程信息">
        <section class="day-summary" aria-live="polite">
          <div class="summary-heading">
            <div>
              <p class="eyebrow" id="summary-date">四日总览</p>
              <h2 id="summary-title">首尔单城 · 四条主题路线</h2>
            </div>
            <span class="distance-total" id="summary-distance">约 134 km</span>
          </div>
          <p id="summary-description">抵达、宫阙人文、圣水江南购物与弘大返程，地图显示全部地点及每日方向。</p>
        </section>

        <section class="legend" aria-label="地图图例">
          <span><i data-lucide="hotel"></i>酒店</span>
          <span><i data-lucide="landmark"></i>景点</span>
          <span><i data-lucide="utensils"></i>餐厅</span>
          <span><i data-lucide="shopping-bag"></i>购物</span>
          <span><i data-lucide="plane"></i>机场</span>
        </section>

        <section class="timeline-section">
          <h3>行程节点</h3>
          <div class="timeline" id="timeline"></div>
        </section>

        <section class="selection-panel" id="selection-panel" aria-live="polite">
          <div class="selection-empty">
            <i data-lucide="mouse-pointer-click"></i>
            <p>选择地图地点或路线段</p>
          </div>
        </section>
      </aside>

      <section class="map-wrap" aria-label="首尔旅行互动地图">
        <div id="map"></div>
        <div class="map-status" id="map-status">
          <span class="status-dot"></span>
          <span>全部路线</span>
        </div>
        <button class="map-control-button" id="fit-route" type="button" aria-label="显示完整路线" data-tooltip="显示完整路线">
          <i data-lucide="scan"></i>
        </button>
      </section>
    </main>

    <footer class="site-footer">
      <span>天气为 9 月下旬气候基线，出发前 7–10 天更新短期预报。</span>
      <span>底图 © OpenStreetMap / CARTO · 地点详情保留高德落点</span>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script src="app.js"></script>
</body>
</html>
